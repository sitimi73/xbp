
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="jotaroのつぶやきと日々の記録">
<title>つぶやき | jotaro</title>

<style>
:root {
  --bg: #f7f7f2;
  --ink: #202722;
  --sub: #59665d;
  --line: #d5dad3;
  --blue: #315bea;
  --white: #fffefa;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, "Yu Gothic", Meiryo, sans-serif;
  line-height: 1.8;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

a:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

.container {
  width: min(900px, calc(100% - 48px));
  margin: auto;
}



header {
  border-bottom: 1px solid var(--line);
}

.header-inner {
  min-height: 78px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -.07em;
}

.logo span {
  color: var(--blue);
}

.back {
  color: var(--blue);
  font-size: 13px;
  font-weight: 700;
}

.back:hover {
  text-decoration: underline;
}



.hero {
  padding: 100px 0 76px;
}

.label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .14em;
  color: var(--blue);
}

h1 {
  margin: 14px 0 15px;
  font-size: clamp(56px, 10vw, 100px);
  font-weight: 900;
  letter-spacing: -.08em;
  line-height: 1.2;
}

h1 span {
  color: var(--blue);
}

.intro {
  margin: 0;
  color: var(--sub);
  font-size: 16px;
}



.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 24px 0;
  border-top: 2px solid var(--ink);
  border-bottom: 1px solid var(--line);
}

.toolbar-title {
  font-size: 15px;
  font-weight: 800;
}

.count {
  margin-left: 10px;
  color: var(--sub);
  font-size: 12px;
}

.search {
  width: min(260px, 45%);
  padding: 10px 14px;
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 6px;
  color: var(--ink);
  font-size: 13px;
}



.notes {
  padding-bottom: 110px;
}

.note {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 24px;
  padding: 34px 0;
  border-bottom: 1px solid var(--line);
  animation: appear .35s ease both;
}

.note-date {
  color: var(--sub);
  font-size: 12px;
  font-weight: 700;
  padding-top: 4px;
}

.note-content {
  min-width: 0;
}

.note-category {
  display: inline-block;
  padding: 3px 10px;
  background: #e4eafc;
  color: var(--blue);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 800;
}

.note-text {
  margin: 13px 0 0;
  font-size: 16px;
  line-height: 2;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.empty {
  padding: 80px 0;
  color: var(--sub);
  text-align: center;
  font-size: 14px;
}



footer {
  border-top: 1px solid var(--line);
  padding: 27px 0;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--sub);
}

.footer-inner a:hover {
  color: var(--blue);
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(9px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  .container {
    width: calc(100% - 36px);
  }

  .header-inner {
    min-height: 65px;
  }

  .hero {
    padding: 72px 0 55px;
  }

  h1 {
    font-size: 59px;
  }

  .toolbar {
    flex-wrap: wrap;
  }

  .search {
    width: 100%;
  }

  .note {
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 28px 0;
  }

  .note-text {
    font-size: 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="container header-inner">
    <a href="./index.html" class="logo">
      jotaro<span>.</span>
    </a>

    <a href="./index.html" class="back">
      ← Portfolioに戻る
    </a>
  </div>
</header>

<main class="container">

  <section class="hero">
    <div class="label">NOTES / JOTARO</div>

    <h1>つぶやき<span>.</span></h1>

    <p class="intro">
      制作のこと、日々のこと。
    </p>
  </section>

  <section aria-label="つぶやき一覧">

    <div class="toolbar">
      <div>
        <span class="toolbar-title">最近の投稿</span>
        <span class="count" id="count"></span>
      </div>

      <input
        type="search"
        class="search"
        id="search"
        placeholder="投稿を検索"
        aria-label="投稿を検索">
    </div>

    <div class="notes" id="notes"></div>

  </section>

</main>

<footer>
  <div class="container footer-inner">
    <span>© jotaro</span>
    <a href="./index.html">ポートフォリオへ戻る ↑</a>
  </div>
</footer>

<script>



const posts = [








];



const notes = document.getElementById("notes");
const count = document.getElementById("count");
const search = document.getElementById("search");

function renderPosts() {
  const keyword = search.value.trim().toLowerCase();

  const filtered = posts
    .filter(post =>
      post.text.toLowerCase().includes(keyword) ||
      (post.category || "").toLowerCase().includes(keyword) ||
      post.date.includes(keyword)
    )
    .sort((a, b) => b.date.localeCompare(a.date));

  notes.replaceChildren();

  count.textContent = `${filtered.length}件`;

  if (filtered.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = keyword
      ? "該当する投稿はありません。"
      : "まだ投稿はありません。";

    notes.appendChild(empty);
    return;
  }

  filtered.forEach(post => {
    const article = document.createElement("article");
    article.className = "note";

    const date = document.createElement("time");
    date.className = "note-date";
    date.dateTime = post.date;
    date.textContent = post.date.replace(/-/g, ".");

    const content = document.createElement("div");
    content.className = "note-content";

    if (post.category) {
      const category = document.createElement("span");
      category.className = "note-category";
      category.textContent = post.category;
      content.appendChild(category);
    }

    const text = document.createElement("p");
    text.className = "note-text";
    text.textContent = post.text;

    content.appendChild(text);
    article.append(date, content);
    notes.appendChild(article);
  });
}

search.addEventListener("input", renderPosts);
renderPosts();

</script>
</body>
</html>
